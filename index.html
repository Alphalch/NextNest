<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NEXTNEST</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Modern Matte Grey Palette */
      --bg-canvas: #111315;
      --bg-main: #181a1d;
      --bg-panel: #1d2024;
      --bg-card: #24282d;
      --bg-input: #14171a;
      --border: #2e3338;
      --border-subtle: #25292e;

      /* Comfortable Typography Colors */
      --text-primary: #eef2f5;
      --text-secondary: #9ba3ab;
      --text-muted: #6e7781;

      /* Lighter Shade of Mint Green Accent */
      --mint-accent: #82cfa0;
      --mint-light: #a3e0ba;
      --mint-hover: #93d9ae;
      --mint-banner-bg: #192e23;
      --mint-banner-border: #2b4c3b;
      --mint-text-dark: #0c1c12;

      /* Status Notification Colors */
      --concern-yellow: #eab308;
      --concern-bg: #2d2612;
      --concern-border: #5c4b18;
      --concern-text: #fde047;

      --error-red: #ef4444;
      --error-bg: #2f1618;
      --error-border: #692629;
      --error-text: #fca5a5;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-primary);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13.5px;
      line-height: 1.5;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ================= TOP STATUS BAR ================= */
    .top-bar {
      height: 68px;
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border);
      display: grid;
      grid-template-columns: 180px 1fr auto;
      align-items: center;
      padding: 0 20px;
      gap: 20px;
      flex-shrink: 0;
      z-index: 20;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 1.08rem;
      letter-spacing: 1.5px;
      color: var(--text-primary);
    }

    .brand-indicator {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--mint-accent);
    }

    /* Center Status Notification Banner */
    .status-banner {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 9px 18px;
      border-radius: 8px;
      border: 1px solid var(--mint-banner-border);
      background: var(--mint-banner-bg);
      transition: all 0.2s ease;
      max-width: 800px;
      width: 100%;
      justify-self: center;
    }

    .status-orb {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      flex-shrink: 0;
      background: radial-gradient(circle at 32% 32%, #d8f8e5, #82cfa0 65%, #3b7a57);
      box-shadow: 0 0 12px rgba(130, 207, 160, 0.35);
    }

    .status-content {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .status-title {
      font-size: 0.81rem;
      font-weight: 700;
      letter-spacing: 0.7px;
      text-transform: uppercase;
      color: var(--mint-light);
      line-height: 1.2;
    }

    .status-subtitle {
      font-size: 0.8rem;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }

    /* Yellow Concern State */
    .status-banner.state-concern {
      background: var(--concern-bg);
      border-color: var(--concern-border);
    }
    .status-banner.state-concern .status-orb {
      background: radial-gradient(circle at 32% 32%, #fef9c3, #eab308 65%, #854d0e);
      box-shadow: 0 0 12px rgba(234, 179, 8, 0.35);
    }
    .status-banner.state-concern .status-title {
      color: var(--concern-text);
    }

    /* Red Error State */
    .status-banner.state-error {
      background: var(--error-bg);
      border-color: var(--error-border);
    }
    .status-banner.state-error .status-orb {
      background: radial-gradient(circle at 32% 32%, #fee2e2, #ef4444 65%, #7f1d1d);
      box-shadow: 0 0 12px rgba(239, 68, 68, 0.4);
    }
    .status-banner.state-error .status-title {
      color: var(--error-text);
    }

    /* Top-Right Download Symbol Buttons */
    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .dl-icon {
      width: 15px;
      height: 15px;
      stroke: currentColor;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      flex-shrink: 0;
    }

    .progress-track {
      height: 2px;
      width: 100%;
      background: var(--bg-panel);
      overflow: hidden;
      flex-shrink: 0;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--mint-accent);
      transition: width 0.15s ease;
    }

    /* ================= 3-COLUMN WORKSPACE ================= */
    .workspace {
      display: grid;
      grid-template-columns: 355px 1fr 345px;
      flex: 1;
      overflow: hidden;
    }

    /* Left Primary Sidebar (Sections 1-3 + Bottom-Left Summary/Debug) */
    .left-sidebar {
      background: var(--bg-panel);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .left-sections-scroll {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    /* Bottom-Left Summary & Debug Panel */
    .bottom-left-summary {
      padding: 12px 16px;
      background: var(--bg-panel);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }

    .summary-box {
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .summary-box-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-subtle);
      padding-bottom: 6px;
      margin-bottom: 2px;
    }

    .summary-box-title {
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-secondary);
    }

    .tab-switch {
      display: flex;
      gap: 4px;
    }

    .tab-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      font-size: 0.7rem;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 4px;
      cursor: pointer;
    }

    .tab-btn.active {
      background: var(--bg-card);
      color: var(--mint-light);
      border-color: var(--border);
    }

    .stat-rows {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
    }

    .stat-row-label {
      color: var(--text-secondary);
    }

    .stat-row-val {
      color: var(--text-primary);
      font-weight: 600;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.77rem;
    }

    .util-bar-track {
      height: 6px;
      width: 100%;
      background: var(--bg-card);
      border-radius: 999px;
      overflow: hidden;
      margin-top: 4px;
    }

    .util-bar-fill {
      height: 100%;
      width: 0%;
      background: var(--mint-accent);
      border-radius: 999px;
      transition: width 0.25s ease;
    }

    .debug-log-view {
      display: none;
      height: 112px;
      overflow-y: auto;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.71rem;
      line-height: 1.5;
      color: var(--text-secondary);
    }

    .log-entry { margin-bottom: 3px; }
    .log-ok { color: var(--mint-light); }
    .log-warn { color: var(--concern-text); }
    .log-err { color: var(--error-text); }

    /* Right Sidebar (Sections 4-5 at Top-Right, Summary + Start Nesting at Bottom-Right) */
    .right-sidebar {
      background: var(--bg-panel);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow-y: auto;
    }

    .right-top-group {
      display: flex;
      flex-direction: column;
    }

    .right-bottom-dock {
      padding: 14px 16px;
      background: var(--bg-panel);
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 12px;
      flex-shrink: 0;
    }

    .mini-summary-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .mini-card {
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 7px 10px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .mini-label {
      font-size: 0.67rem;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .mini-val {
      font-size: 0.86rem;
      font-weight: 600;
      color: var(--text-primary);
      font-family: 'JetBrains Mono', monospace;
    }

    /* Section Styling */
    .section {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border-subtle);
    }

    .section-header {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.9px;
      color: var(--text-secondary);
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 600;
    }

    /* Upload Box */
    .upload-card {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      background: var(--bg-input);
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      transition: border-color 0.15s ease;
    }

    .upload-card:hover, .upload-card.dragover {
      border-color: var(--mint-accent);
    }

    .upload-btn-pill {
      background: var(--mint-accent);
      color: var(--mint-text-dark);
      font-weight: 600;
      font-size: 0.78rem;
      padding: 6px 12px;
      border-radius: 6px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .upload-hint {
      font-size: 0.78rem;
      color: var(--text-secondary);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Form Controls */
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 10px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .field label {
      font-size: 0.75rem;
      color: var(--text-secondary);
      font-weight: 500;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-wrap input[type="number"], .input-wrap select, textarea {
      width: 100%;
      background: var(--bg-input);
      border: 1px solid var(--border);
      color: var(--text-primary);
      padding: 7px 10px;
      border-radius: 6px;
      font-size: 0.82rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s ease;
    }

    .input-wrap input:focus, .input-wrap select:focus, textarea:focus {
      border-color: var(--mint-accent);
    }

    .unit {
      position: absolute;
      right: 10px;
      font-size: 0.72rem;
      color: var(--text-muted);
      pointer-events: none;
    }

    /* Rotation Slider Control */
    .slider-box {
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 9px 11px;
      margin-bottom: 10px;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .slider-top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.75rem;
    }

    .slider-val-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.74rem;
      font-weight: 600;
      color: var(--mint-light);
      background: var(--mint-banner-bg);
      border: 1px solid var(--mint-banner-border);
      padding: 1px 7px;
      border-radius: 4px;
    }

    input[type="range"].mint-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 5px;
      background: var(--bg-card);
      border-radius: 999px;
      outline: none;
      cursor: pointer;
    }

    input[type="range"].mint-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 15px;
      height: 15px;
      border-radius: 50%;
      background: var(--mint-accent);
      border: 2px solid var(--bg-panel);
      cursor: pointer;
      transition: transform 0.1s ease, background 0.15s ease;
    }

    input[type="range"].mint-slider::-webkit-slider-thumb:hover {
      background: var(--mint-light);
      transform: scale(1.1);
    }

    .slider-presets {
      display: flex;
      justify-content: space-between;
      gap: 4px;
    }

    .preset-chip {
      flex: 1;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.67rem;
      padding: 2px 0;
      border-radius: 4px;
      cursor: pointer;
      text-align: center;
      transition: all 0.12s ease;
    }

    .preset-chip:hover, .preset-chip.active {
      border-color: var(--mint-accent);
      color: var(--mint-light);
      background: var(--mint-banner-bg);
    }

    /* Buttons */
    .btn {
      background: var(--bg-card);
      color: var(--text-primary);
      border: 1px solid var(--border);
      padding: 7px 12px;
      border-radius: 7px;
      font-size: 0.79rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn:hover:not(:disabled) {
      background: #2c3137;
      border-color: #3d444c;
    }

    .btn:disabled {
      opacity: 0.38;
      cursor: not-allowed;
    }

    .btn-mint {
      background: var(--mint-accent);
      color: var(--mint-text-dark);
      border-color: var(--mint-accent);
      font-weight: 600;
    }

    .btn-mint:hover:not(:disabled) {
      background: var(--mint-hover);
      border-color: var(--mint-hover);
    }

    .btn-nest-primary {
      width: 100%;
      padding: 11px 16px;
      font-size: 0.9rem;
      font-weight: 600;
      background: var(--mint-accent);
      color: var(--mint-text-dark);
      border: 1px solid var(--mint-light);
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s ease;
      letter-spacing: 0.3px;
    }

    .btn-nest-primary:hover:not(:disabled) {
      background: var(--mint-hover);
    }

    .btn-sm {
      padding: 4px 9px;
      font-size: 0.73rem;
      border-radius: 5px;
    }

    /* BOM Box & Red Unmatch Styling */
    .bom-container {
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .bom-container.bom-error {
      border-color: var(--error-red);
      background: rgba(239, 68, 68, 0.08);
    }

    .bom-textarea {
      resize: vertical;
      min-height: 46px;
      max-height: 90px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.74rem;
      line-height: 1.4;
      background: var(--bg-panel);
    }

    .bom-feedback {
      font-size: 0.73rem;
      color: var(--text-secondary);
      padding: 5px 8px;
      border-radius: 5px;
      background: var(--bg-panel);
    }

    .bom-feedback.status-ok {
      color: var(--mint-light);
      border: 1px solid var(--mint-banner-border);
      background: var(--mint-banner-bg);
    }

    .bom-feedback.status-unmatched {
      color: var(--error-text);
      border: 1px solid var(--error-border);
      background: var(--error-bg);
      font-weight: 500;
    }

    /* Parts List */
    .parts-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 190px;
      overflow-y: auto;
      padding-right: 2px;
    }

    .part-row {
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 6px 10px;
      display: grid;
      grid-template-columns: 36px 1fr auto;
      gap: 10px;
      align-items: center;
    }

    .part-row.unmatched-part {
      border-color: var(--error-red);
      background: var(--error-bg);
    }

    .unmatched-badge {
      background: var(--error-red);
      color: #ffffff;
      font-size: 0.62rem;
      font-weight: 700;
      padding: 1px 5px;
      border-radius: 4px;
      letter-spacing: 0.3px;
    }

    .part-thumb {
      width: 36px;
      height: 36px;
      background: var(--bg-canvas);
      border: 1px solid var(--border-subtle);
      border-radius: 5px;
    }

    .part-info {
      overflow: hidden;
    }

    .part-title {
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .part-sub {
      font-size: 0.71rem;
      color: var(--text-secondary);
      font-family: 'JetBrains Mono', monospace;
    }

    .part-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .qty-field {
      width: 48px;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      color: var(--text-primary);
      padding: 4px 6px;
      border-radius: 5px;
      text-align: center;
      font-size: 0.78rem;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 600;
    }

    .btn-del {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 3px 6px;
      border-radius: 4px;
    }

    .btn-del:hover {
      color: var(--error-text);
